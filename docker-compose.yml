version: "3.9"

x-common-env: &common-env
  MONGO_URL: mongodb://mongodb:27017/yelp_db
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-secret-key}
  JWT_ALGORITHM: HS256
  JWT_EXPIRATION_MINUTES: "1440"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── API Services ───────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - user_uploads:/app/uploads
    restart: unless-stopped

  restaurant-service:
    build:
      context: ./backend
      dockerfile: restaurant-service/Dockerfile
    container_name: restaurant-service
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - restaurant_uploads:/app/uploads
    restart: unless-stopped

  owner-service:
    build:
      context: ./backend
      dockerfile: owner-service/Dockerfile
    container_name: owner-service
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  review-service:
    build:
      context: ./backend
      dockerfile: review-service/Dockerfile
    container_name: review-service
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - review_uploads:/app/uploads
    restart: unless-stopped

  # ── Worker Services ────────────────────────────────────────────────────────

  review-worker:
    build:
      context: ./backend
      dockerfile: review-worker/Dockerfile
    container_name: review-worker
    environment:
      <<: *common-env
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  restaurant-worker:
    build:
      context: ./backend
      dockerfile: restaurant-worker/Dockerfile
    container_name: restaurant-worker
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-worker:
    build:
      context: ./backend
      dockerfile: user-worker/Dockerfile
    container_name: user-worker
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_USER_SERVICE_URL: http://localhost:8001
      VITE_RESTAURANT_SERVICE_URL: http://localhost:8002
      VITE_OWNER_SERVICE_URL: http://localhost:8003
      VITE_REVIEW_SERVICE_URL: http://localhost:8004
    depends_on:
      - user-service
      - restaurant-service
      - review-service
    restart: unless-stopped

volumes:
  mongo_data:
  user_uploads:
  restaurant_uploads:
  review_uploads:
