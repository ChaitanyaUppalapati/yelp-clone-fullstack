apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: yelp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: yelp/restaurant-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: yelp-config
            - secretRef:
                name: yelp-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: yelp
spec:
  selector:
    app: restaurant-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
