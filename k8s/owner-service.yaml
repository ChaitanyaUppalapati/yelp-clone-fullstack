apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-service
  namespace: yelp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: owner-service
  template:
    metadata:
      labels:
        app: owner-service
    spec:
      containers:
        - name: owner-service
          image: yelp/owner-service:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: yelp-config
            - secretRef:
                name: yelp-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: owner-service
  namespace: yelp
spec:
  selector:
    app: owner-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
